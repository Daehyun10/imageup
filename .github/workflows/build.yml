name: build-exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --noconsole --onefile --name ImageOverlay overlay.py

      - uses: actions/upload-artifact@v4
        with:
          name: ImageOverlay
          path: dist/ImageOverlay.exe
